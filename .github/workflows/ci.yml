name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc dvc-http certifi

      - name: Configure SSL Certificates
        run: |
          python -c "import certifi; print('SSL_CERT_FILE=' + certifi.where())" >> "$GITHUB_ENV"

      - name: Pull DVC Data
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user naresh1486
          dvc remote modify dagshub --local password "$DAGSHUB_TOKEN"
          dvc pull -r dagshub

      - name: Run Test Suite
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: |
          pytest -v

      - name: Build Docker Image
        run: |
          docker build -t mp217-api:1.0 .
