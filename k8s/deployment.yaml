apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp217-api
  labels:
    app: mp217-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp217-api
  template:
    metadata:
      labels:
        app: mp217-api
    spec:
      containers:
        - name: mp217-api
          image: mp217-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
